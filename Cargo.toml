[package]
name = "lusty"
version = "0.1.0"
edition = "2021"
description = "Native file/buffer picker for Neovim (Lusty successor)"
license = "MIT"

[[bin]]
name = "lusty"
path = "src/main.rs"

[dependencies]
lusty-fuzzy = { path = "crates/lusty-fuzzy" }
walkdir = "2"
rayon = "1"
crossterm = "0.28"
libc = "0.2"

[workspace]
members = [".", "crates/lusty-fuzzy"]
resolver = "2"
