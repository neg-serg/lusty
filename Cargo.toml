[package]
name = "lusty"
version = "0.1.0"
edition = "2021"
description = "Native file/buffer picker for Neovim (Lusty successor)"
license = "MIT"

[[bin]]
name = "lusty"
path = "src/main.rs"

[dependencies]
lusty-core = { path = "crates/lusty-core" }
lusty-fuzzy = { path = "crates/lusty-fuzzy" }
crossterm = "0.28"
libc = "0.2"

[workspace]
members = [".", "crates/lusty-fuzzy", "crates/lusty-core"]
resolver = "2"
